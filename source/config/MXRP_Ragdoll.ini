; MXRP Ragdoll - réglages
; À copier dans le dossier "plugins" de MX Bikes, à côté de MXRP_Ragdoll.dlo.
; Relancer le jeu après une modification.
; Seules les touches et le réseau se règlent ici. Tous les autres réglages (physique, marche,
; caméra, mode en ligne...) sont fixés dans le plugin : ajoutés ici, ils sont ignorés.
; Le bouton « Plugin Ragdoll : ACTIF / COUPE » du menu du jeu active ou coupe le plugin.

[touches]
; Toutes les touches du plugin. Clavier : une ou deux touches par action (ex. "Z W").
; Noms : lettres A-Z, chiffres 0-9, F1-F12, NUM0-NUM9, SHIFT (MAJ), CTRL, ALT, SPACE (ESPACE),
; ENTER, TAB, BACKSPACE, UP/DOWN/LEFT/RIGHT (fleches), DELETE (SUPPR), INSERT, HOME, END,
; PAGEUP, PAGEDOWN, MOUSE4, MOUSE5, MOUSEMID, NONE (aucune).
key_forward = Z W      ; avancer (et se relever)
key_back = S           ; reculer
key_left = Q A         ; gauche
key_right = D          ; droite
key_run = CTRL         ; courir
key_crouch = SHIFT     ; a pied : s'accroupir (encore : se relever)
key_getup = E          ; se relever sans bouger
key_bike = E           ; relever la moto, puis monter dessus
key_view = V           ; a pied : vue 1re personne / 3e personne
key_jump = SPACE       ; a pied : sauter (et monter sur un objet plus haut qu'une marche)
key_prio_kbd = F7      ; bascule : à pied, les touches du plugin ne vont plus au jeu (oui / non)
key_prio_pad = F8      ; bascule : à pied, la manette ne va plus au jeu (sauf le bouton de respawn)
pad_prio_pad = NONE    ; même bascule depuis la manette (bouton ou combinaison)
clavier_prio = 1       ; au départ : clavier prioritaire à pied
manette_prio = 1       ; au départ : manette prioritaire à pied
marche_forcee = 1      ; 1 = tombé ou à pied, le respawn du jeu est bloqué (il faut marcher jusqu'à la moto)
respawn_appui_long = 20 ; appui long sur la touche de respawn (s) : retour sur la piste quand même
releve_appui = 2       ; tombé : garder la touche (ou le stick) ce temps (s) pour se relever (0 = tout de suite)
key_dismount = F       ; descendre de la moto (arrete, mode Essai)
key_menu = P           ; menu position du casque et des bottes
; Manette : A, B, X, Y, LB, RB, BACK, START, LS, RS (clic des sticks), DUP, DDOWN, DLEFT,
; DRIGHT (croix), RT, LT (gachettes), NONE. Plusieurs a la fois : "LB+RB".
pad_getup = Y          ; se relever
pad_bike = Y           ; relever la moto, puis monter dessus
pad_view = NONE        ; a pied : vue 1re / 3e personne (le bouton de vue du jeu marche aussi)
pad_crouch = RS        ; a pied : s'accroupir (clic du stick droit)
pad_jump = A           ; a pied : sauter
pad_dismount = Y       ; descendre de la moto : bouton garde enfonce (moto arretee)
dismount_hold = 0.8    ; secondes a garder pad_dismount enfonce
dismount_crash = 1     ; 1 = descente sans chute visible : le jeu passe en chute (mains libres), le pilote reste debout, la moto reste droite
dismount_fade = 0      ; 1 = fondu au noir pendant la bascule de la moto (on ne la voit pas tomber)
dismount_fall = 0      ; 1 = descendre en couchant doucement la moto (vraie chute, bras normaux, respawn pour remonter)
                       ; 0 = descendre sans chute (remonte sans respawn, mais le jeu dessine les bras en croix)
pad_run = RT           ; courir (gachette d'accelerateur)

[reseau]
; --- Multi : voir marcher les autres joueurs qui ont le plugin ---
; Avec Radmin VPN (ou sur le même réseau local) : rien à régler, les plugins se trouvent tout seuls.
; Par internet avec ports ouverts : un seul joueur est l'hôte (reseau_hote = 1, port UDP ouvert
; sur sa box) et les autres mettent son IP publique dans reseau_ip.
reseau = 1             ; 1 = échange la marche et les chutes avec les autres plugins
reseau_hote = 0        ; 1 = c'est moi l'hôte
reseau_ip =            ; adresse de l'hôte (vide si c'est moi l'hôte)
reseau_port = 47731    ; port UDP (le même pour tout le monde ; à ouvrir chez l'hôte sans Radmin)
multi = 0              ; 1 = multi active : sur les serveurs RAGDOLL, pilote, chutes et objets partages avec les autres joueurs du plugin (question au premier lancement)
expulsion_auto = 0     ; 1 = sur MON serveur RAGDOLL, expulser les joueurs sans plugin (60 s + 30 s d'avertissement)
