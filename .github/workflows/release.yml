# Builds MXRP Ragdoll from the source in this repository (run by hand from the Actions tab, with the
# release number, e.g. 3.4), and attaches the files to a DRAFT release whose tag v<number> points to the
# exact commit that was built (the tag is created when the author publishes the release).
# Anyone can check in the Actions log that the release files come from that code.
name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number (e.g. 3.4) -> tag v3.4, "MXRP Beta 3.4"'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Release name
        run: echo "REL=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip python3-cryptography

      - name: Build and test
        working-directory: source
        run: |
          make
          make installer-release NAME="MXRP Beta ${REL}"

      - name: Package
        working-directory: source
        run: |
          VER=$(grep -o 'PLUGIN_VERSION "[^"]*"' src/plugin.c | cut -d'"' -f2)
          mkdir -p ../out man/MXRP_Ragdoll/plugins
          cp build/MXRP_Ragdoll.dlo "../out/MXRP_Ragdoll_${VER}.dlo"
          cp "build/MXRP Beta ${REL}.exe" ../out/MXRP_Ragdoll_Installer.exe
          (cd build && zip -q "../../out/MXRP_Beta_${REL}.zip" "MXRP Beta ${REL}.exe")
          cp MXRP_Ragdoll_LISEZ-MOI_README.txt man/MXRP_Ragdoll/
          cp build/MXRP_Ragdoll.dlo config/MXRP_Ragdoll.ini man/MXRP_Ragdoll/plugins/
          (cd man && zip -qr "../../out/MXRP_Beta_${REL}_manual.zip" MXRP_Ragdoll)

      - name: Sign the update files
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        working-directory: source
        run: |
          if [ -z "$UPDATE_SIGN_KEY" ]; then
            echo "::warning::No UPDATE_SIGN_KEY secret: the .sig files must be added by the author"
            exit 0
          fi
          mkdir -p keys
          printf '%s\n' "$UPDATE_SIGN_KEY" > keys/maj_signature_privee.pem
          python3 tools/sign_release.py ../out/MXRP_Ragdoll_*.dlo ../out/MXRP_Ragdoll_Installer.exe
          rm -f keys/maj_signature_privee.pem

      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${REL}" out/* --draft --target "$GITHUB_SHA" \
            --title "MXRP Beta ${REL}" \
            --notes "Built by GitHub Actions from commit $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
