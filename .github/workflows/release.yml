# Builds MXRP Ragdoll from a public tag (run by hand from the Actions tab, with the release number,
# e.g. 3.4): it first creates and pushes the tag v<number> on the current commit of main, checks that
# tag out, builds and tests from it, and attaches the files to a DRAFT release for that tag (the author
# writes the notes and publishes it). Anyone can check in the Actions log that the files come from that tag.
name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number (e.g. 3.4) -> tag v3.4, "MXRP Beta 3.4"'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create the public tag and build from it
        run: |
          REL="${{ inputs.version }}"
          case "$REL" in *[!0-9A-Za-z.-]*|'') echo "bad version"; exit 1;; esac
          echo "REL=$REL" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$REL"
          git push origin "v$REL"
          git checkout --detach "v$REL"
          echo "Building tag v$REL at commit $(git rev-parse HEAD)"

      - name: Install MinGW-w64 (exact versions, Ubuntu 24.04 "noble" release)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-win32=13.2.0-6ubuntu1+26.1 \
            gcc-mingw-w64-x86-64-win32-runtime=13.2.0-6ubuntu1+26.1 \
            gcc-mingw-w64-base=13.2.0-6ubuntu1+26.1 \
            binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4 \
            mingw-w64-x86-64-dev=11.0.1-3build1 \
            mingw-w64-common=11.0.1-3build1
          x86_64-w64-mingw32-gcc-win32 --version | head -1

      - name: Build and test
        working-directory: source
        run: |
          make MINGW_CC=x86_64-w64-mingw32-gcc-win32
          make installer-release MINGW_CC=x86_64-w64-mingw32-gcc-win32 NAME="MXRP Beta ${REL}"

      - name: Package
        working-directory: source
        run: |
          VER=$(grep -o 'PLUGIN_VERSION "[^"]*"' src/plugin.c | cut -d'"' -f2)
          mkdir -p ../out man/MXRP_Ragdoll/plugins
          cp build/MXRP_Ragdoll.dlo "../out/MXRP_Ragdoll_${VER}.dlo"
          cp "build/MXRP Beta ${REL}.exe" ../out/MXRP_Ragdoll_Installer.exe
          (cd build && python3 -m zipfile -c "../../out/MXRP_Beta_${REL}.zip" "MXRP Beta ${REL}.exe")
          cp MXRP_Ragdoll_LISEZ-MOI_README.txt man/MXRP_Ragdoll/
          cp build/MXRP_Ragdoll.dlo config/MXRP_Ragdoll.ini man/MXRP_Ragdoll/plugins/
          (cd man && python3 -m zipfile -c "../../out/MXRP_Beta_${REL}_manual.zip" MXRP_Ragdoll)

      - name: Sign the update files
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        working-directory: source
        run: |
          if [ -z "$UPDATE_SIGN_KEY" ]; then
            echo "::warning::No UPDATE_SIGN_KEY secret: the .sig files must be added by the author"
            exit 0
          fi
          pip install --break-system-packages cryptography==44.0.0
          mkdir -p keys
          printf '%s\n' "$UPDATE_SIGN_KEY" > keys/maj_signature_privee.pem
          python3 tools/sign_release.py ../out/MXRP_Ragdoll_*.dlo ../out/MXRP_Ragdoll_Installer.exe
          rm -f keys/maj_signature_privee.pem

      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${REL}" out/* --draft --verify-tag \
            --title "MXRP Beta ${REL}" \
            --notes "Built by GitHub Actions from tag v${REL} (commit $(git rev-parse HEAD)): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
